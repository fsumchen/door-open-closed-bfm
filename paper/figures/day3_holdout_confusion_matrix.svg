<svg xmlns="http://www.w3.org/2000/svg" width="420" height="400" viewBox="0 0 420 400">
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#182230}.title{font-size:20px;font-weight:700}.axis{font-size:14px;font-weight:600}.label{font-size:15px}.count{font-size:34px;font-weight:700}</style>
<text x="210" y="34" text-anchor="middle" class="title">Different-day holdout confusion matrix</text>
<text x="210" y="66" text-anchor="middle" class="axis">Predicted door state</text>
<text x="24" y="233" text-anchor="middle" class="axis" transform="rotate(-90 24 233)">Actual door state</text>
<text x="213.0" y="98" text-anchor="middle" class="label">closed</text>
<text x="339.0" y="98" text-anchor="middle" class="label">open</text>
<text x="138" y="180.0" text-anchor="end" class="label">closed</text>
<rect x="150" y="112" width="126" height="126" fill="rgb(116,121,125)" stroke="#ffffff" stroke-width="3"/>
<text x="213.0" y="187.0" text-anchor="middle" class="count">20</text>
<rect x="276" y="112" width="126" height="126" fill="rgb(246,251,255)" stroke="#ffffff" stroke-width="3"/>
<text x="339.0" y="187.0" text-anchor="middle" class="count">0</text>
<text x="138" y="306.0" text-anchor="end" class="label">open</text>
<rect x="150" y="238" width="126" height="126" fill="rgb(246,251,255)" stroke="#ffffff" stroke-width="3"/>
<text x="213.0" y="313.0" text-anchor="middle" class="count">0</text>
<rect x="276" y="238" width="126" height="126" fill="rgb(122,127,131)" stroke="#ffffff" stroke-width="3"/>
<text x="339.0" y="313.0" text-anchor="middle" class="count">19</text>
<text x="210" y="375" text-anchor="middle" class="label">100.0% accuracy, 39 held-out windows</text>
</svg>
